repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        # Enable verbose output for the 'mypy' hook.
        verbose: true
        # Ignore the exit code of mypy to pass the commit
        entry: bash -c 'mypy "$@" || true' --
