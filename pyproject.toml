[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "erpnext_egypt_compliance"
authors = [
    { name = "Axentor, LLC", email = "apps@axentor.co" },
]
description = "Integration for Egyptian Tax Authority"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # pydantic v2 is required: schemas call .model_dump()/.model_dump_json()
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
test = [
    "pytest_frappe",
]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
# sites-path is passed on the command line (e.g. --sites-path=<bench>/sites)
addopts = "-p no:warnings -vvs"

[tool.ruff]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
#    "T201",
    "T203",
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
