name: Backport

on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    # Label a PR "backport version-15-hotfix" (or "backport version-16-hotfix") to copy it there after merge
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: korthout/backport-action@v4
        with:
          # Bot token so CI runs on the backport PR (falls back to GITHUB_TOKEN until the secret exists)
          github_token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
