name: Generate Semantic Release
on:
  push:
    branches: [main, version-16]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Release
    # Skip the push made by semantic-release itself
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          persist-credentials: false # https://github.com/semantic-release/semantic-release/blob/master/docs/recipes/ci-configurations/github-actions.md#pushing-packagejson-changes-to-a-master-branch

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20
          
      - name: Setup dependencies
        run: |
          npm install @semantic-release/git @semantic-release/exec --no-save

      - name: Create Release
        env:
          # Bot token so the release commit can be pushed to a protected branch
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release